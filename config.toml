# ======================================================================
# Settings for run_experiments.py (experiments E0-E11). The pools are the
# [universe] above; the data is what download_subgraph.py saved.
# ======================================================================
[experiments]
# Experiments to run, in order. Each one writes to <output_dir>/<id>/ and is skipped
# on the next run once it finished (delete its folder or set force_refresh to redo it).
run = ["E0", "E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10", "E11"]
output_dir = "results_prelim"
force_refresh = false          # true = ignore finished experiments and cached intermediate files
max_workers = 6                # processes for per-pool / per-grid-cell work
seed = 20270101                # random seed for bootstraps and random selection

[experiments.data]
data_dir = "pool_data"
# BigQuery exports (Query 1: daily gas cost of LP entry/exit; Query 3: Swap logs). "" = not available.
gas_file = "pool_data/bigquery/script_job_4f5d1c6feed1ce61b406c406030dafe6_0.csv"
swaps_file = "pool_data/bigquery/bq-results-20261027-055450-1793080502742.csv"
eth_token = "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"   # WETH, prices gas costs in USD

[experiments.sample]
start = 2021-06-01             # first period start
end = 2026-11-01               # exclusive; periods past the last downloaded hour are dropped
first_decision = 2022-06-01    # first out-of-sample selection decision
regime_split = 2022-07-01      # E3 structural split
# Subperiod windows reported in E5 (calendar years are added automatically)
event_windows = [
    { name = "Terra collapse", start = 2022-05-01, end = 2022-07-01 },
    { name = "FTX collapse", start = 2022-11-01, end = 2022-12-01 },
    { name = "USDC depeg", start = 2023-03-01, end = 2023-04-01 },
]

[experiments.eligibility]
min_history_months = 12        # months of history before a pool can be selected
min_tvl_usd = 1_000_000        # TVL at the decision time

[experiments.costs]
capital_usd = 100_000          # total capital, split equally over the pools held
entry_swap_fraction = 0.5      # share of a new position swapped (at the pool's fee) to reach the token ratio
include_gas = true             # charge the daily median gas cost of entry and exit

[experiments.statistics]
bootstrap_samples = 2000
block_months = 3               # moving-block length for monthly series
block_days = 30                # moving-block length for daily-start overlapping windows (>= window length)
newey_west_lags = 3            # lags for the information-coefficient t-statistic
confidence = 0.95
min_pools_for_ic = 5           # months with fewer eligible pools get no information coefficient

[experiments.selection]
# E5 (main experiment)
tail_quantile = 0.10           # Net90 = median fee + P10(IL)
horizon = "1m"                 # "<n>m" months or "<n>d" days
calibration_months = 12        # 0 = expanding window
top_k = [1, 3, 5]
strategies = ["net_tail", "fee_minus_lvr", "median_fee", "low_variance", "mean_net", "equal_weight", "hodl_5050", "hodl_eth"]
random_draws = 1000            # random top-k portfolios for the permutation baseline
# Risk-aversion grid for fee - sigma^2/8 - lambda * tail, the tail being the model-based tail_quantile IL loss
# (strategies lvr_tail_<lambda>; lambda = 0 is fee_minus_lvr). Fixed in advance, not tuned on the results.
risk_aversion = [0.1, 0.25, 0.5, 1, 2, 5]

[experiments.sensitivity]
# E6 grid (every combination is one backtest)
tail_quantiles = [0.05, 0.10, 0.20]
horizons = ["14d", "1m", "2m"]
calibration_months = [6, 12, 0]
top_k = [1, 3, 5]

[experiments.persistence]
# E3
window_days = 180              # rolling AR(1) window (as in the paper)
step_days = 7                  # step between rolling windows
phi_max = 0.999                # windows with phi outside (0, phi_max) are excluded
variance_ratio_lags = [2, 5, 10, 20]
test_alpha = 0.05

[experiments.calibration]
# E4
min_train_months = 12
rolling_months = 12

[experiments.horizon_matching]
# E7
fixed_months = [1, 2, 3]
max_months = 3                 # half-life-matched horizon is clipped to [1, max_months]
window_days = 180              # trailing window for the half-life estimate at each decision
top_k = 3                      # pools selected by Net90 at each decision

[experiments.concentrated]
# E8
half_widths = [0.01, 0.05, 0.10, 0.20]    # +-w around the entry price
sigma_multiples = [1.0, 2.0, 3.0]          # +-k * trailing monthly sigma of the log price
validation_pools = ["0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640", "0xa6cc3c2531fdaa6ae1a3ca84c2855806728693e8"]
validation_start = 2024-01-01  # swap-level validation window (must match BigQuery Query 3)
validation_end = 2024-07-01
plot_risk_aversion = [0, 0.25, 1]           # lambdas shown in ic_vs_range (every lambda is in ic_by_range.csv)

[experiments.fee_validation]
# E0
min_interval_hours = 24        # shorter snapshot intervals are dominated by the hourly granularity
tolerance = 0.05               # share of intervals within +-5% is reported

[experiments.replication]
# E11: same pipeline on another network. Skipped until this folder exists
# (same layout as pool_data: hourly/, meta/, token_prices/).
data_dir = "pool_data_arbitrum"
gas_file = ""                  # "" = no gas cost (negligible on Arbitrum)
eth_token = "0x82af49447d8a07e3bd95bd0d56f35241523fbab1"   # WETH on Arbitrum


# ======================================================================
# Settings for make_paper_assets.py (LaTeX tables, number macros and figures for the ICBC paper)
# ======================================================================
[paper]
results_dir = "results_prelim"       # switch to "results" for the final run after Nov 1
output_dir = "overleaf/generated"    # \input{generated/...} in overleaf/main_icbc2027.tex
sensitivity_k = 3                    # top-k whose E6 sensitivity heatmap goes into the paper
main_k = 3                           # top-k quoted in the abstract
abstract_lambda = 0.25               # the "moderate" tail penalty quoted in the abstract (must be in risk_aversion)
