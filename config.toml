# Settings for download_subgraph.py (Uniswap v3 Ethereum mainnet subgraph download).
# The Graph API key goes in secrets.toml (copy secrets.example.toml), not here.

[run]
# introspect | meta | hourly | daily | positions | prices | report | all
# "all" = introspect, meta, hourly, daily, positions, prices, report
step = "all"
# Subset of pool addresses to process; empty = every pool in [universe] below
only_pools = []
# Re-run schema introspection even if pool_data/meta/schema.json is cached ("all" always refreshes)
refresh_schema = false

[subgraph]
host = "https://gateway.thegraph.com"
subgraph_id = "5zvR82QoaXYFyDEKLZ9t6v9adgnptxYpKpSbxtgVENFV"

[download]
output_dir = "pool_data"
start_date = 2021-05-05
end_date = 2026-11-01          # exclusive
page_size = 1000               # The Graph maximum per query
max_positions = 1000           # full-range positions per pool
snapshot_chunk = 100           # positions per positionSnapshots query
checkpoint_every = 5           # save hourly data every N pages
force_refresh = false          # true = ignore saved data and download everything again

[network]
max_workers = 4                # pools/tokens downloaded concurrently
max_retries = 8
min_interval_seconds = 0.2     # minimum gap between requests across all workers
timeout_seconds = 90

[report]
# Existing poolDayDatas (daily closes) used for the spot check
daily_close_dir = "old/pool_data/updated"
max_workers = 4                # processes for the per-pool sanity/spot-check analysis

